[project]
name = "fizzy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "drdong654", email = "vanjdamanj@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agno>=3.1.4",
    "aiogram>=3.31.0",
    "asyncpg>=0.32.0",
    "datasets>=5.1.0",
    "dotenv>=0.9.9",
    "ollama>=0.6.3",
    "openai>=3.35.1",
    "sqlalchemy[asyncio]>=2.1.4",
]

[project.scripts]
fizzy = "fizzy:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
